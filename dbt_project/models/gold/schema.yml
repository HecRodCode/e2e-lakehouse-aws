version: 2

models:
  - name: fact_ventas
    description: >
      Una fila por evento purchase válido de Silver. price es el precio
      asociado al evento; no se interpreta como ingreso realizado.
    columns:
      - name: event_hash
        description: Hash del evento fuente usado como identificador técnico.
        data_tests:
          - not_null
          - unique
      - name: event_date
        data_tests:
          - not_null
      - name: event_time
        data_tests:
          - not_null
      - name: event_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["purchase"]
      - name: product_id
        data_tests:
          - not_null
      - name: user_id
        data_tests:
          - not_null
      - name: user_session
        data_tests:
          - not_null
      - name: price
        data_tests:
          - not_null
